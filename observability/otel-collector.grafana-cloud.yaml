# Sends the app's metrics, logs, and traces to Grafana Cloud's OTLP gateway.
# Used by compose.grafana-cloud.yaml; credentials come from the environment.
extensions:
  basicauth/grafana_cloud:
    client_auth:
      username: ${env:GRAFANA_OTLP_INSTANCE_ID}
      password: ${env:GRAFANA_OTLP_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana_cloud

service:
  extensions: [basicauth/grafana_cloud]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana_cloud]
